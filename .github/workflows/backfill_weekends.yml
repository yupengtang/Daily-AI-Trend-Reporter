name: Backfill Weekend Reports

# Manual repair tool. The old version hardcoded a fixed list of early-2026
# dates and referenced a 'sundays-full' option that was never in the choice
# list, so it could not fill any gap that appeared later. This version simply
# asks the generator which weekend posts are missing and regenerates those.

on:
  workflow_dispatch:
    inputs:
      weeks_back:
        description: 'How many weeks back to scan for missing weekend posts'
        required: true
        default: '8'
      start_date:
        description: 'Optional explicit start date (YYYY-MM-DD) - overrides the scan'
        required: false
      end_date:
        description: 'Optional explicit end date (YYYY-MM-DD) - overrides the scan'
        required: false

permissions:
  contents: write

env:
  LLM_PROVIDER: groq
  LLM_MODEL: openai/gpt-oss-120b

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install -r requirements.txt

      - name: Preflight - papers feed and LLM backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 test_api.py

      - name: Backfill missing weekend posts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"

          if [ -n "$START" ] && [ -n "$END" ]; then
            echo "Regenerating explicit range $START .. $END"
            python3 batch_generate.py --start "$START" --end "$END"
          else
            echo "Scanning the last ${{ github.event.inputs.weeks_back }} weeks for gaps"
            python3 batch_generate.py --heal-only --heal-weeks "${{ github.event.inputs.weeks_back }}"
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add _posts/

          if git diff --staged --quiet; then
            echo "No new files"
            exit 0
          fi

          git commit -m "Backfill weekend reports"
          git pull --rebase origin main
          git push
