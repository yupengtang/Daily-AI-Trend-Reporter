name: 🌱 Daily AI Frontier - Daily Generation

on:
  schedule:
    - cron: '0 14 * * *'  # Run daily at 14:00 UTC (7:00 AM PDT, 10:00 PM CST)
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD), leave empty for today'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD), leave empty for today'
        required: false
      heal_weeks:
        description: 'Also backfill weekend posts missing from the last N weeks'
        required: false
        default: '4'

# Add permissions for the workflow
permissions:
  contents: write
  actions: read

env:
  # Swap the backend by changing these two values; no code change needed.
  # Supported providers: groq, openai, huggingface, together.
  LLM_PROVIDER: groq
  LLM_MODEL: openai/gpt-oss-120b

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # backfills pace requests to respect rate limits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check API key
        run: |
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "❌ GROQ_API_KEY is not set in repository secrets"
            exit 1
          fi
          echo "✅ GROQ_API_KEY is configured"

      # A failing preflight check stops the run here, so a dead backend is
      # reported loudly instead of producing an empty, falsely-green run.
      - name: Preflight - papers feed and LLM backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 test_api.py

      - name: Generate daily AI research digest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          HEAL="${{ github.event.inputs.heal_weeks }}"
          HEAL="${HEAL:-4}"

          echo "📝 Generating today's AI research digest (heal window: ${HEAL} weeks)..."
          if [ -n "$START" ] && [ -n "$END" ]; then
            python3 batch_generate.py --start "$START" --end "$END" --heal-weeks "$HEAL"
          else
            python3 batch_generate.py --heal-weeks "$HEAL"
          fi

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add _posts/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          NEW_FILES=$(git diff --staged --name-only | grep "_posts/" | head -5)
          COMMIT_MSG="Auto-generated daily AI research digest"
          if [ -n "$NEW_FILES" ]; then
            COMMIT_MSG="Auto-generated: $(echo "$NEW_FILES" | tr '\n' ' ')"
          fi

          git commit -m "$COMMIT_MSG"
          echo "✅ Committed: $COMMIT_MSG"

          # Rebase before pushing so a concurrent commit does not fail the run.
          git pull --rebase origin main
          git push
          echo "✅ Changes pushed to repository"
